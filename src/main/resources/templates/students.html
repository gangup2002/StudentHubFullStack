<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3fc;
            color: #252238;
        }

        header {
            background: #51258b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            font-size: 13px;
        }

        main {
            max-width: 950px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
        }

        h2 {
            color: #51258b;
            font-size: 19px;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 13px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d8d3e8;
            border-radius: 6px;
            font-size: 13px;
        }

        input:focus, select:focus {
            outline: 2px solid #c49bd5;
        }

        button {
            background: #51258b;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete {
            background: #dc3545;
            margin: 0;
        }

        .edit {
            background: #777;
            margin: 0;
        }

        .success {
            background: #d7f4e2;
            color: #17683b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }

        th {
            background: #252238;
            color: white;
        }

        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .actions {
            white-space: nowrap;
        }

        .actions form {
            display: inline;
        }

        .actions a {
            text-decoration: none;
        }

        .actions button {
            font-size: 12px;
        }

        .count {
            display: inline-block;
            background: #eee4ff;
            color: #51258b;
            padding: 3px 9px;
            border-radius: 15px;
            font-size: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Registration System</h1>
    <p>Spring Boot · Thymeleaf · H2 Database</p>
</header>

<main>

    <!-- Success message -->
    <div class="success"
         th:if="${message != null}"
         th:text="${message}">
    </div>

    <!-- Registration form -->
    <section class="card">

        <h2 th:text="${student.id == null
            ? 'Register a Student'
            : 'Edit Student'}">
            Register a Student
        </h2>

        <form th:action="@{/students}"
              th:object="${student}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <label for="name">Full Name</label>
            <input id="name"
                   type="text"
                   th:field="*{name}"
                   placeholder="Enter full name"
                   required>

            <label for="email">Email</label>
            <input id="email"
                   type="email"
                   th:field="*{email}"
                   placeholder="Enter email address"
                   required>

            <label for="phone">Phone (10 digits)</label>
            <input id="phone"
                   type="tel"
                   th:field="*{phone}"
                   placeholder="Enter phone number"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   required>

            <label for="course">Course</label>
            <select id="course"
                    th:field="*{course}"
                    required>

                <option value="">-- Select a course --</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Data Science">Data Science</option>

            </select>

            <label for="age">Age</label>
            <input id="age"
                   type="number"
                   th:field="*{age}"
                   min="1"
                   max="120"
                   placeholder="Enter age"
                   required>

            <button type="submit">Save Student</button>

        </form>
    </section>

    <!-- Registered students -->
    <section class="card">

        <h2>
            Registered Students
            <span class="count" th:text="${students.size()}">0</span>
        </h2>

        <div class="table-wrap">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="s : ${students}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.name}"></td>
                        <td th:text="${s.email}"></td>
                        <td th:text="${s.phone}"></td>
                        <td th:text="${s.course}"></td>
                        <td th:text="${s.age}"></td>

                        <td class="actions">

                            <a th:href="@{/students/edit/{id}(id=${s.id})}">
                                <button type="button" class="edit">
                                    Edit
                                </button>
                            </a>

                            <form th:action="@{/students/delete/{id}(id=${s.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this student?');">

                                <button type="submit" class="delete">
                                    Delete
                                </button>

                            </form>

                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7" style="text-align:center;">
                            No students registered yet.
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>
    </section>

</main>

<footer>
    COSC 32133 / BECS 32263 · Lab Sheet 04
</footer>

</body>
</html>
```
